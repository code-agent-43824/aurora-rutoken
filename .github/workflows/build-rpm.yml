name: Build Aurora RPM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PSDK_RELEASE: "5.2.1"
  PSDK_BUILD: "5.2.1.200"

jobs:
  # Гарантирует существование релиза ci-latest ДО параллельной заливки из
  # matrix-сборки, чтобы обе архитектуры не пытались создать релиз одновременно.
  prepare-release:
    name: Ensure ci-latest release exists
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create ci-latest if missing
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view ci-latest >/dev/null 2>&1; then
            gh release create ci-latest --prerelease \
              --title "Последняя CI-сборка (main)" \
              --notes "Сборка готовится…"
          fi

  build-rpm:
    name: Build and verify ${{ matrix.arch }}
    needs: [prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7hl, aarch64]
    env:
      # Каждая архитектура собирается на отдельном чистом runner/workspace.
      # Это запрещает повторное использование object-файлов другой архитектуры.
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Platform SDK tarballs
        uses: actions/cache@v4
        with:
          path: ~/AuroraPlatformSDK/tarballs
          key: psdk-tarballs-${{ env.PSDK_BUILD }}-${{ matrix.arch }}
          restore-keys: |
            psdk-tarballs-${{ env.PSDK_BUILD }}-${{ matrix.arch }}
            psdk-tarballs-${{ env.PSDK_BUILD }}-

      - name: Install Aurora Platform SDK
        run: ./ci/install-psdk.sh

      - name: Build, sign and verify RPM
        run: ./ci/build-rpm.sh

      - name: Download and verify official Rutoken PKCS#11 RPM
        run: ./ci/fetch-rutoken-pkcs11.sh

      # Артефакт Actions этой архитектуры — второй канал скачивания по просьбе
      # владельца (2026-07-20), В ДОПОЛНЕНИЕ к голым .rpm в релизе ci-latest.
      # GitHub всегда отдаёт артефакт зазипованной папкой — это ОК как второй
      # канал; основной канал с голыми .rpm — релиз (см. AGENTS.md).
      - name: Read package version for artifact name
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '$1 == "Version:" { print $2; exit }' rpm/*.spec)
          release=$(awk '$1 == "Release:" { print $2; exit }' rpm/*.spec)
          [[ -n "$version" && -n "$release" ]]
          echo "version_release=${version}-${release}" >> "$GITHUB_OUTPUT"

      - name: Upload RPMs of this architecture as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: rutokentestapp-${{ steps.package.outputs.version_release }}-${{ matrix.arch }}-rpms
          path: RPMS/*.${{ matrix.arch }}.rpm
          if-no-files-found: error

  # Единственная точка записи в rolling release. Она получает оба проверенных
  # Actions artifacts и запускается только после успеха всей matrix.
  publish-release:
    name: Publish verified four-RPM set
    if: github.ref == 'refs/heads/main'
    needs: [build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download both verified architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rutokentestapp-*-rpms
          path: release-rpms
          merge-multiple: true

      - name: Publish complete set with rollback
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./ci/publish-release.sh release-rpms
